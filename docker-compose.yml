services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bellman-backend
    ports:
      - "8084:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
